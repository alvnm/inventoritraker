services:
  db:
    image: postgres:16-alpine
    container_name: dnd-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dnd_inventory
    ports:
      - "5432:5432"
    volumes:
      - dnd_pgdata:/var/lib/postgresql/data

volumes:
  dnd_pgdata:
